[project]
name = "otsearch-bench"
version = "0.1.0"
description = "Benchmark harness for evidence search over the Open Targets Platform"
readme = "README.md"
authors = [
    { name = "Pavel Abramau", email = "Abrapv64@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.5.0",
    "httpx>=0.28.1",
    "networkx>=3.6.1",
    "pydantic>=2",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # long literal questions and API payloads

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: talks to the live Open Targets Platform API"]
